<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Decorative circles -->
  <circle cx="1080" cy="100" r="200" fill="rgba(59,130,246,0.15)" />
  <circle cx="150" cy="530" r="150" fill="rgba(30,58,95,0.4)" />

  <!-- House icon -->
  <g transform="translate(100, 180)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="rgba(255,255,255,0.12)" />
    <!-- roof -->
    <polygon points="10,38 40,12 70,38" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="3" stroke-linejoin="round"/>
    <!-- walls -->
    <rect x="18" y="38" width="44" height="28" rx="2" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="3"/>
    <!-- door -->
    <rect x="32" y="50" width="16" height="16" rx="2" fill="rgba(255,255,255,0.5)"/>
  </g>

  <!-- Split icon -->
  <g transform="translate(220, 180)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="rgba(255,255,255,0.12)" />
    <!-- left coin -->
    <circle cx="30" cy="40" r="14" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="3"/>
    <text x="30" y="45" text-anchor="middle" fill="rgba(255,255,255,0.9)" font-family="system-ui,sans-serif" font-size="13" font-weight="700">€</text>
    <!-- divider -->
    <line x1="50" y1="26" x2="50" y2="54" stroke="rgba(255,255,255,0.6)" stroke-width="2" stroke-dasharray="4,3"/>
    <!-- right coin -->
    <circle cx="62" cy="40" r="8" fill="rgba(255,255,255,0.25)" stroke="rgba(255,255,255,0.6)" stroke-width="2"/>
  </g>

  <!-- Calendar icon -->
  <g transform="translate(340, 180)">
    <rect x="0" y="0" width="80" height="80" rx="16" fill="rgba(255,255,255,0.12)" />
    <rect x="14" y="28" width="52" height="38" rx="4" fill="none" stroke="rgba(255,255,255,0.9)" stroke-width="3"/>
    <line x1="14" y1="40" x2="66" y2="40" stroke="rgba(255,255,255,0.9)" stroke-width="2"/>
    <line x1="26" y1="22" x2="26" y2="34" stroke="rgba(255,255,255,0.9)" stroke-width="3" stroke-linecap="round"/>
    <line x1="54" y1="22" x2="54" y2="34" stroke="rgba(255,255,246,0.9)" stroke-width="3" stroke-linecap="round"/>
    <rect x="26" y="48" width="8" height="8" rx="1" fill="rgba(255,255,255,0.7)"/>
    <rect x="40" y="48" width="8" height="8" rx="1" fill="rgba(255,255,255,0.7)"/>
  </g>

  <!-- Wordmark -->
  <text x="100" y="360" font-family="system-ui,-apple-system,sans-serif" font-size="96" font-weight="800" fill="#ffffff" letter-spacing="-2">House M8</text>

  <!-- Tagline -->
  <text x="100" y="430" font-family="system-ui,-apple-system,sans-serif" font-size="32" font-weight="400" fill="rgba(255,255,255,0.75)" letter-spacing="0.5">Manage shared living expenses with your roommates</text>

  <!-- Decorative bottom line -->
  <rect x="100" y="500" width="120" height="4" rx="2" fill="rgba(99,179,237,0.8)" />
  <rect x="232" y="500" width="40" height="4" rx="2" fill="rgba(255,255,255,0.2)" />
</svg>